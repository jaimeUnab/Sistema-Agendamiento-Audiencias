{% extends 'base_dashboard.html' %}
<!-- ================================================= -->
<!--                   PLANTILLA                        -->
<!-- ================================================= -->
<!-- Hereda la estructura principal del sistema (menú lateral y barra superior),
     la misma que usan el Dashboard y el Listado de Usuarios, para mantener
     una identidad visual consistente en todo el sistema. -->

{% block title %}
Crear Usuario
{% endblock %}
<!-- Título que aparecerá en la pestaña del navegador -->

{% block page_title %}
Crear Usuario
{% endblock %}
<!-- Título que se muestra en la barra superior de la página -->

{% block content %}
<!-- Aquí comienza el contenido propio de esta página -->

<div class="row">

    <div class="col">

        <!-- Misma tarjeta (card shadow-sm) usada en el Listado de Usuarios -->
        <div class="card shadow-sm">

            <div class="card-body">

                <h4>Crear Usuario</h4>

                <hr>

                <!-- ========================================= -->
                <!--                FORMULARIO                  -->
                <!-- ========================================= -->
                <!-- Se utiliza exclusivamente {{ form }}: UsuarioForm ya
                     define sus campos, su orden (field_order) y sus
                     validaciones, por lo que aquí no se vuelve a
                     declarar ningún campo manualmente. El renderizado
                     por defecto de Django incluye tanto los errores de
                     cada campo como los errores generales del
                     formulario (non_field_errors). -->

                <form method="post">

                    {% csrf_token %}

                    {{ form }}

                    <!-- ===================================== -->
                    <!--                BOTONES                 -->
                    <!-- ===================================== -->

                    <div class="mt-4">

                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>

                        <!-- Cancelar regresa al listado sin guardar cambios -->
                        <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
<!-- Fin del contenido de la página -->
