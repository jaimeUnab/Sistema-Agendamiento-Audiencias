{% extends 'base.html' %}
{% load static %}

{% block title %}Inicio de sesión{% endblock %}

{% block content %}

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg p-5" style="width:450px; border-radius:20px;">

        <!-- Logo oficial del sistema (mismo archivo que usa el sidebar en
             base_dashboard.html: static/img/icono programa.png, no se
             duplica). "logo-login" (ver static/css/style.css) reutiliza la
             misma técnica de recorte circular que ".logo" del sidebar
             -overflow:hidden + border-radius:50% + object-fit:cover-, solo
             que con un tamaño fijo (no vh-relativo) apropiado para esta
             tarjeta centrada, en vez del clamp() pensado para el sidebar. -->
        <div class="text-center mb-3">
            <div class="logo-login mx-auto">
                <img src="{% static 'img/icono programa.png' %}"
                     alt="Sistema de Agendamiento de Audiencias">
            </div>
        </div>

        <div class="text-center mb-4">

            <h2 class="fw-bold text-primary">
                Sistema de Agendamiento
            </h2>

            <h4 class="fw-light">
                de Audiencias
            </h4>

            <p class="text-muted mt-3">
                Inicie sesión para acceder al sistema
            </p>

        </div>

        {% if form.errors %}
        <div class="alert alert-danger">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control form-control-lg"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control form-control-lg"
                    required>

            </div>

            <button class="btn btn-primary btn-lg w-100">

                Iniciar sesión

            </button>

        </form>

    </div>

</div>

{% endblock %}
